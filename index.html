      function stringValue(value, fallback = "") {
        return typeof value === "string" ? value : fallback;
      }

      function hasText(value) {
        return typeof value === "string" && value.trim().length > 0;
      }

      function firstText(...values) {
        return values.find((value) => hasText(value)) || "";
      }

      function numberValue(value, fallback = 0) {

      function getMediaPath(media, predicate) {

      function parseJsonContent(value, fallback) {
        if (typeof value !== "string" || !value.trim()) {

        try {

      function isTimelineHeroEntry(entry) {
        return Boolean(entry?.isHero) || stringValue(entry?.title).trim().toLowerCase() === "seeme";
      }

      function applyHeroMediaFallbacks(entry) {
        if (!isTimelineHeroEntry(entry)) {

      function preloadImage(source) {

          const image = new Image();
          image.onload = () => resolve(source);
          image.onerror = () => resolve("");

      function attachPrivacyFooterLink() {

      async function submitJourneyOptInEmail(email, quote, status) {
        const normalizedEmail = typeof email === "string" ? email.trim() : "";

        if (!normalizedEmail) {
          status.textContent = "Enter your email to opt in.";
          return false;
        }

        if (!JOURNEY_SUBSCRIPTION_ENDPOINT) {
          status.textContent = "Opt-ins are available on the live site.";
          return false;
        }

        status.textContent = "Saving...";

        try {
          const response = await fetch(JOURNEY_SUBSCRIPTION_ENDPOINT, {
            method: "POST",
            mode: "cors",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email: normalizedEmail,
              quote,
              sourcePath: window.location.pathname || "/",
            }),
          });

          if (!response.ok) {
            const payload = await response.json().catch(() => ({}));
            throw new Error(stringValue(payload.error, "Could not save your opt-in."));
          }

          status.textContent = "";
          return true;
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : "Could not save your opt-in.";
          return false;
        }
      }

      function stabilizeJourneyInputFocus(input, form) {
        if (!(input instanceof HTMLInputElement) || input.dataset.focusStabilized === "true") {
          return;
        }

        input.dataset.focusStabilized = "true";
        input.addEventListener("focus", () => {
          if (!window.matchMedia("(hover: none), (pointer: coarse)").matches) {
            return;
          }

          const settle = () => {
            const target = form instanceof HTMLElement ? form : input;
            const visualViewport = window.visualViewport;
            const visibleTop = visualViewport?.offsetTop || 0;
            const visibleHeight = visualViewport?.height || window.innerHeight;
            const visibleBottom = visibleTop + visibleHeight;
            const targetBottom = visibleBottom - 14;
            const rect = target.getBoundingClientRect();
            const delta = rect.bottom - targetBottom;

            if (Math.abs(delta) > 8) {
              window.scrollBy({ top: delta, behavior: "smooth" });
            }
          };

          window.requestAnimationFrame(settle);
          window.setTimeout(settle, 180);
          window.setTimeout(settle, 360);
        });
      }

        const observer = new MutationObserver(() => {

      function parseRgbColor(value) {
        if (typeof value !== "string") {
          return [255, 255, 255];
        }

        const trimmed = value.trim();

        if (trimmed.startsWith("#")) {
          let hex = trimmed.slice(1);
          if (hex.length === 3) {
            hex = hex
              .split("")
              .map((char) => char + char)
              .join("");
          }

          if (hex.length === 6) {
            const parsed = Number.parseInt(hex, 16);
            return [(parsed >> 16) & 255, (parsed >> 8) & 255, parsed & 255];
          }
        }

        const match = trimmed.match(/rgba?\(([^)]+)\)/i);
        if (!match) {
          return [255, 255, 255];
        }

        const channels = match[1].split(",").map((part) => Number.parseFloat(part.trim()));
        return [channels[0] || 255, channels[1] || 255, channels[2] || 255];
      }

      function rgbToCss(rgb) {
        return `rgb(${Math.round(rgb[0])}, ${Math.round(rgb[1])}, ${Math.round(rgb[2])})`;
      }

      function mixColor(base, target, amount) {
        return [
          base[0] + (target[0] - base[0]) * amount,
          base[1] + (target[1] - base[1]) * amount,
          base[2] + (target[2] - base[2]) * amount,
        ];
      }

      function isDarkColor(rgb) {
        return (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 < 170;
      }

      function findTimelineImageBaseColor(element) {
        let current = element.parentElement;

        while (current && current !== document.body) {
          const background = window.getComputedStyle(current).backgroundColor;
          if (background && background !== "rgba(0, 0, 0, 0)" && background !== "transparent") {
            return parseRgbColor(background);
          }
          current = current.parentElement;
        }

        return [255, 255, 255];
      }

      function isTimelineContentImage(image) {
        const source = image.getAttribute("src") || "";

        if (!source) {
          return false;
        }

        if (/appstorebadge|icon|techstack/i.test(source)) {
          return false;
        }

        return (
          /lineup|coverlettergen|synechron-|asu-|lufthansa-|aviatar-|seeme-2026-product/i.test(
            source,
          ) || source.includes("product-mobile")
        );
      }

      function ensureTimelineImageHost(image) {
        const parent = image.parentElement;
        if (!parent) {
          return null;
        }

        if (parent.childElementCount === 1) {
          if (window.getComputedStyle(parent).position === "static") {
            parent.style.position = "relative";
          }
          parent.style.overflow = "hidden";
          return parent;
        }

        const wrapper = document.createElement("div");
        const computed = window.getComputedStyle(image);

        wrapper.style.position = "relative";
        wrapper.style.display = "block";
        wrapper.style.overflow = "hidden";
        wrapper.style.width = image.style.width || "100%";
        wrapper.style.height =
          image.style.height && image.style.height !== "auto" ? image.style.height : computed.height;
        wrapper.style.maxWidth = image.style.maxWidth || computed.maxWidth;
        wrapper.style.maxHeight = image.style.maxHeight || computed.maxHeight;
        wrapper.style.borderRadius = computed.borderRadius;
        wrapper.style.margin = computed.margin;
        wrapper.style.alignSelf = computed.alignSelf;

        image.style.margin = "0";
        image.style.width = "100%";
        image.style.height = "100%";
        image.style.maxWidth = "100%";
        image.style.maxHeight = "100%";

        parent.insertBefore(wrapper, image);
        wrapper.appendChild(image);
        return wrapper;
      }

      function enhanceTimelineImage(image) {
        if (!(image instanceof HTMLImageElement) || image.dataset.timelineImageEnhanced === "true") {
          return;
        }

        if (!isTimelineContentImage(image)) {
          return;
        }

        const host = ensureTimelineImageHost(image);
        if (!host) {
          return;
        }

        image.dataset.timelineImageEnhanced = "true";

        const base = findTimelineImageBaseColor(host);
        const dark = isDarkColor(base);
        const highlight = mixColor(base, dark ? [255, 255, 255] : [0, 0, 0], 0.12);
        const accent = mixColor(base, dark ? [255, 255, 255] : [0, 0, 0], 0.28);
        const borderColor = dark ? "rgba(255,255,255,0.14)" : "rgba(255,255,255,0.32)";

        const placeholder = document.createElement("div");
        placeholder.setAttribute("aria-hidden", "true");
        placeholder.style.position = "absolute";
        placeholder.style.inset = "0";
        placeholder.style.borderRadius = window.getComputedStyle(image).borderRadius;
        placeholder.style.background = `linear-gradient(135deg, ${rgbToCss(highlight)} 0%, ${rgbToCss(
          accent,
        )} 52%, ${rgbToCss(highlight)} 100%)`;
        placeholder.style.backgroundSize = "180% 180%";
        placeholder.style.animation = "timeline-image-shimmer 2.4s ease-in-out infinite";
        placeholder.style.boxShadow = `inset 0 0 0 1px ${borderColor}`;
        placeholder.style.transition = "opacity 700ms ease";
        placeholder.style.pointerEvents = "none";

        image.style.opacity = "0";
        image.style.transition = image.style.transition
          ? `${image.style.transition}, opacity 700ms ease`
          : "opacity 700ms ease";
        image.style.position = "relative";
        image.style.zIndex = "1";

        host.insertBefore(placeholder, image);

        const reveal = () => {
          image.style.opacity = "1";
          placeholder.style.opacity = "0";
          window.setTimeout(() => placeholder.remove(), 720);
        };

        if (image.complete && image.naturalWidth > 0) {
          requestAnimationFrame(reveal);
          return;
        }

        image.addEventListener("load", reveal, { once: true });
        image.addEventListener(
          "error",
          () => {
            image.style.opacity = "1";
            placeholder.remove();
          },
          { once: true },
        );
      }

      function enhanceTimelineImages(root = document) {
        if (!(root instanceof Element || root instanceof Document)) {
          return;
        }

        if (root instanceof HTMLImageElement) {
          enhanceTimelineImage(root);
          return;
        }

        root.querySelectorAll("img").forEach((image) => enhanceTimelineImage(image));
      }

      function startTimelineImageEnhancer() {
        enhanceTimelineImages();

        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            mutation.addedNodes.forEach((node) => {
              if (!(node instanceof Element)) {
                return;
              }

              if (node instanceof HTMLImageElement) {
                enhanceTimelineImage(node);
                return;
              }

              enhanceTimelineImages(node);
            });
          }
        });

        observer.observe(document.body, { childList: true, subtree: true });
      }

      function adjustTimelineHeroSubtitleWidth() {
        if (window.innerWidth <= 768) {
          return;
        }

        const heroAnchor = document.querySelector("a[href*='seemeai.app']");
        let heroBlock = heroAnchor instanceof Element ? heroAnchor.closest("div") : null;

        while (heroBlock && !heroBlock.querySelector("h1, h2, h3")) {
          heroBlock = heroBlock.parentElement;
        }

        if (!heroBlock) {
          return;
        }

        const heroHeading = Array.from(heroBlock.querySelectorAll("h1, h2, h3")).find(
          (element) => element.textContent?.trim() === "SeeMe",
        );
        const titleBlock = heroHeading?.parentElement;
        if (!titleBlock) {
          return;
        }

        const subtitleParagraphs = Array.from(titleBlock.querySelectorAll("p"));
        if (subtitleParagraphs.length === 0) {
          return;
        }

        const [heroSubtitle] = subtitleParagraphs;
        if (!(heroSubtitle instanceof HTMLElement)) {
          return;
        }

        titleBlock.style.maxWidth = "660px";
        titleBlock.style.marginLeft = "auto";
        titleBlock.style.marginRight = "auto";
        heroSubtitle.style.maxWidth = "520px";
        heroSubtitle.style.width = "100%";
        heroSubtitle.style.marginLeft = "auto";
        heroSubtitle.style.marginRight = "auto";
      }

      function mapTimelineRow(row) {
        const metadata =
          row && typeof row.metadata === "object" && row.metadata !== null ? row.metadata : {};
        const media = Array.isArray(row?.event_media)
          ? [...row.event_media].sort(
              (left, right) => numberValue(left?.sort_order) - numberValue(right?.sort_order),
            )
          : [];
        const firstLink =
          Array.isArray(row?.links) && typeof row.links[0] === "string" ? row.links[0] : "";
        const heroCover = getMediaPath(media, (item) => item.kind === "cover");
        const lineupImage = getMediaPath(media, (item) =>
          ["lineup", "cover", "detail", "asset"].includes(item.kind),
        );
        const productImage = getMediaPath(
          media,
          (item) => item.kind === "asset" && item.alt?.toLowerCase().includes("product"),
        );
        const productImageMobile = getMediaPath(
          media,
          (item) => item.kind === "asset" && item.alt?.toLowerCase().includes("mobile"),
        );
        const appStoreBadge = getMediaPath(
          media,
          (item) => item.kind === "asset" && item.alt?.toLowerCase().includes("app store"),
        );

        return {
          date: stringValue(row?.period_label),
          title: stringValue(row?.title),
          subtitle: stringValue(row?.subtitle),
          location: stringValue(row?.location),
          description: stringValue(row?.summary),
          secondDescription: stringValue(metadata.secondDescription),
          icon: getMediaPath(media, (item) => item.kind === "icon"),
          image: lineupImage,
          background: stringValue(metadata.background, "#FFFFFF"),
          techStack: Array.isArray(row?.tech_stack)
            ? row.tech_stack.filter((item) => typeof item === "string")
            : [],
          link: firstLink,
          linkColor: stringValue(metadata.linkColor, "#000000"),
          topSpacing: numberValue(metadata.topSpacing),
          bottomSpacing: numberValue(metadata.bottomSpacing),
          isHero: Boolean(metadata.isHero),
          backgroundImage: stringValue(metadata.backgroundImage, heroCover),
          productImage: stringValue(metadata.productImage, productImage),
          productImageMobile: stringValue(metadata.productImageMobile, productImageMobile),
          appStoreBadge: stringValue(metadata.appStoreBadge, appStoreBadge),
          appStoreUrl: stringValue(metadata.appStoreUrl),
          website: stringValue(metadata.website),
        };
      }

      async function bootstrapPortfolio() {
        try {
          if (VISIT_TRACKING_ENDPOINT) {
            void fetch(VISIT_TRACKING_ENDPOINT, {
              method: "POST",
              mode: "cors",
              keepalive: true,
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                path: window.location.pathname,
                referrer: document.referrer || "",
              }),
            }).catch(() => {});
          }

          const [quoteResponse, journeyQuoteResponse, stackResponse] = CONTENT_ENDPOINT_BASE
            ? await Promise.allSettled([
                fetch(`${CONTENT_ENDPOINT_BASE}?key=hero_quote`),
                fetch(`${CONTENT_ENDPOINT_BASE}?key=journey_quote`),
                fetch(`${CONTENT_ENDPOINT_BASE}?key=number_stack`),
              ])
            : [
                { status: "rejected" },
                { status: "rejected" },
                { status: "rejected" },
              ];

          if (quoteResponse.status === "fulfilled" && quoteResponse.value.ok) {
            const payload = await quoteResponse.value.json();
            window.__PORTFOLIO_QUOTE_DATA__ = [parseJsonContent(payload.body, DEFAULT_QUOTE)];
          } else {
            window.__PORTFOLIO_QUOTE_DATA__ = [DEFAULT_QUOTE];
          }

          if (journeyQuoteResponse.status === "fulfilled" && journeyQuoteResponse.value.ok) {
            const payload = await journeyQuoteResponse.value.json();
            window.__PORTFOLIO_JOURNEY_QUOTE_DATA__ = parseJsonContent(payload.body, DEFAULT_JOURNEY_QUOTE);
          } else {
            window.__PORTFOLIO_JOURNEY_QUOTE_DATA__ = DEFAULT_JOURNEY_QUOTE;
          }

          if (stackResponse.status === "fulfilled" && stackResponse.value.ok) {
            const payload = await stackResponse.value.json();
            window.__PORTFOLIO_ACHIEVEMENTS__ = parseJsonContent(payload.body, DEFAULT_NUMBER_STACK);
          } else {
            window.__PORTFOLIO_ACHIEVEMENTS__ = DEFAULT_NUMBER_STACK;
          }

          const url = new URL("/rest/v1/timeline_events", SUPABASE_URL);
          url.searchParams.set(
            "select",
            "slug,title,subtitle,period_label,location,category,status,sort_order,featured,summary,tech_stack,links,metadata,event_media(kind,path,alt,sort_order)",
          );
          url.searchParams.set("status", "eq.published");
          url.searchParams.set("order", "sort_order.desc");
          url.searchParams.set("event_media.order", "sort_order.asc");

          const response = await fetch(url, {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            },
          });

          if (response.ok) {
            const rows = await response.json();
            if (Array.isArray(rows) && rows.length > 0) {
              const orderedRows = [...rows].sort((left, right) => {
                const leftIsHero = Boolean(left?.metadata?.isHero);
                const rightIsHero = Boolean(right?.metadata?.isHero);

                if (leftIsHero !== rightIsHero) {
                  return leftIsHero ? -1 : 1;
                }

                return (Number(right?.sort_order) || 0) - (Number(left?.sort_order) || 0);
              });

              window.__PORTFOLIO_TIMELINE_DATA__ = await ensureHeroMediaAvailability(
                orderedRows.map(mapTimelineRow),
              );
            }
          }
        } catch (error) {
          console.warn("Portfolio timeline bootstrap fallback", error);
        } finally {
          await import("./assets/index-Xk-FGBtY.js?v=supabase-live-136");
          requestAnimationFrame(() => {
            attachPrivacyFooterLink();
            startJourneyOptInPlacement();
            startTimelineImageEnhancer();
            adjustTimelineHeroSubtitleWidth();
            attachGithubContributionsClick();
            window.setTimeout(attachPrivacyFooterLink, 300);
            window.setTimeout(startJourneyOptInPlacement, 300);
            window.setTimeout(adjustTimelineHeroSubtitleWidth, 300);
            window.setTimeout(attachGithubContributionsClick, 300);
            window.setTimeout(attachGithubContributionsClick, 1200);
          });
        }
      }

      const GITHUB_PROFILE_URL = "https://github.com/iamjannisgrimm";

      function openGithubProfileFromWidget(event) {
        if (event?.metaKey || event?.ctrlKey || event?.shiftKey || event?.altKey) {
          return;
        }

        event?.preventDefault();
        event?.stopPropagation();
        window.open(GITHUB_PROFILE_URL, "_blank", "noopener,noreferrer");
      }

      function attachGithubContributionsClick() {
        const calendar =
          document.querySelector(".github-contributions-link") ||
          document.querySelector(".react-activity-calendar")?.closest("a");

        if (!calendar) {
          return;
        }

        calendar.setAttribute("href", GITHUB_PROFILE_URL);
        calendar.setAttribute("target", "_blank");
        calendar.setAttribute("rel", "noopener noreferrer");
        calendar.setAttribute("aria-label", "Open Jannis Grimm on GitHub");
        calendar.classList.add("github-contributions-link");
        calendar.style.position = "relative";
        calendar.style.zIndex = "50";
        calendar.style.pointerEvents = "auto";
        calendar.style.cursor = "pointer";

        if (calendar.parentElement) {
          calendar.parentElement.style.position = "relative";
          calendar.parentElement.style.zIndex = "50";
          calendar.parentElement.style.pointerEvents = "auto";
        }

        calendar.querySelectorAll(".react-activity-calendar, .react-activity-calendar *").forEach((node) => {
          node.style.pointerEvents = "none";
        });

        let overlay = calendar.querySelector(".portfolio-github-click-overlay");
        if (!overlay) {
          overlay = document.createElement("span");
          overlay.className = "portfolio-github-click-overlay";
          overlay.setAttribute("aria-hidden", "true");
          overlay.style.position = "absolute";
          overlay.style.inset = "0";
          overlay.style.zIndex = "60";
          overlay.style.cursor = "pointer";
          overlay.style.background = "transparent";
          calendar.appendChild(overlay);
        }

        if (!calendar.dataset.githubClickAttached) {
          calendar.addEventListener("click", openGithubProfileFromWidget, true);
          overlay.addEventListener("click", openGithubProfileFromWidget, true);
          calendar.dataset.githubClickAttached = "true";
        }
      }

      bootstrapPortfolio();
    </script>
  </body>
</html>
