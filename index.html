      function stringValue(value, fallback = "") {
        return typeof value === "string" ? value : fallback;
      }

      function hasText(value) {
        return typeof value === "string" && value.trim().length > 0;
      }

      function firstText(...values) {
        return values.find((value) => hasText(value)) || "";
      }

      function numberValue(value, fallback = 0) {
        return typeof value === "number" && Number.isFinite(value) ? value : fallback;
      }

      function getMediaPath(media, predicate) {
        const match = media.find(predicate);
        return typeof match?.path === "string" ? match.path : "";
      }

      function parseJsonContent(value, fallback) {
        if (typeof value !== "string" || !value.trim()) {
          return fallback;
        }

        try {

        } catch {

        }

      function isTimelineHeroEntry(entry) {
        return Boolean(entry?.isHero) || stringValue(entry?.title).trim().toLowerCase() === "seeme";
      }

      function applyHeroMediaFallbacks(entry) {
        if (!isTimelineHeroEntry(entry)) {
          return entry;
        }

        return {
          ...entry,
          backgroundImage: firstText(entry.backgroundImage, HERO_MEDIA_FALLBACKS.backgroundImage),

      }

      function preloadImage(source) {
        if (!hasText(source)) {
          return Promise.resolve("");
        }

        return new Promise((resolve) => {
          const image = new Image();
          image.onload = () => resolve(source);
          image.onerror = () => resolve("");
          image.src = source;
        });
      }

      async function ensureHeroMediaAvailability(entries) {
        if (!Array.isArray(entries) || entries.length === 0) {
          return entries;
        }

        const heroIndex = entries.findIndex((entry) => isTimelineHeroEntry(entry));
        if (heroIndex < 0) {
          return entries;
        }

        const heroEntry = applyHeroMediaFallbacks(entries[heroIndex]);
        const [backgroundImage, productImage, productImageMobile, appStoreBadge] = await Promise.all(
          [
            preloadImage(heroEntry.backgroundImage).then((source) =>
              firstText(source, HERO_MEDIA_FALLBACKS.backgroundImage),
            ),
            preloadImage(heroEntry.productImage).then((source) =>
              firstText(
                source,
                heroEntry.productImageMobile,
                HERO_MEDIA_FALLBACKS.productImage,
                HERO_MEDIA_FALLBACKS.productImageMobile,
              ),
            ),
            preloadImage(heroEntry.productImageMobile).then((source) =>
              firstText(
                source,
                heroEntry.productImage,
                HERO_MEDIA_FALLBACKS.productImageMobile,
                HERO_MEDIA_FALLBACKS.productImage,
              ),
            ),
            preloadImage(heroEntry.appStoreBadge).then((source) =>
              firstText(source, HERO_MEDIA_FALLBACKS.appStoreBadge),
            ),
          ],
        );

        const nextEntries = [...entries];
        nextEntries[heroIndex] = {
          ...heroEntry,
          backgroundImage,
          productImage,
          productImageMobile,
          appStoreBadge,
        };
        return nextEntries;

      async function submitJourneyOptInEmail(email, quote, status) {
        const normalizedEmail = typeof email === "string" ? email.trim() : "";

        if (!normalizedEmail) {
          status.textContent = "Enter your email to opt in.";
          return false;
        }

        if (!JOURNEY_SUBSCRIPTION_ENDPOINT) {
          status.textContent = "Opt-ins are available on the live site.";
          return false;
        }

        status.textContent = "Saving...";

        try {
          const response = await fetch(JOURNEY_SUBSCRIPTION_ENDPOINT, {
            method: "POST",
            mode: "cors",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email: normalizedEmail,
              quote,
              sourcePath: window.location.pathname || "/",
            }),
          });

          if (!response.ok) {
            const payload = await response.json().catch(() => ({}));
            throw new Error(stringValue(payload.error, "Could not save your opt-in."));
          }

          status.textContent = "";
          return true;
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : "Could not save your opt-in.";
          return false;
        }
      }

      function isMobileInteractionViewport() {
        return window.matchMedia("(hover: none), (pointer: coarse)").matches;
      }

      function scrollJourneyOptInFormAboveKeyboard(input, form) {
        if (!isMobileInteractionViewport()) {
          return;
        }

        const settle = () => {
          const target = form instanceof HTMLElement ? form : input;
          const visualViewport = window.visualViewport;
          const visibleTop = visualViewport?.offsetTop || 0;
          const visibleHeight = visualViewport?.height || window.innerHeight;
          const visibleBottom = visibleTop + visibleHeight;
          const targetBottom = visibleBottom - 14;
          const rect = target.getBoundingClientRect();
          const delta = rect.bottom - targetBottom;

          if (Math.abs(delta) > 8) {
            window.scrollBy({ top: delta, behavior: "smooth" });
          }
        };

        window.requestAnimationFrame(settle);
        window.setTimeout(settle, 120);
        window.setTimeout(settle, 260);
        window.setTimeout(settle, 480);
      }

      function focusAndSelectJourneyInput(input, form) {
        if (!(input instanceof HTMLInputElement)) {
          return;
        }

        input.classList.add("is-highlighted");

        try {
          input.focus({ preventScroll: true });
        } catch {
          input.focus();
        }

        try {
          input.select();
          input.setSelectionRange(0, input.value.length);
        } catch {
          // Some mobile browsers disallow selection before the keyboard fully opens.
        }

        scrollJourneyOptInFormAboveKeyboard(input, form);
      }

      function stabilizeJourneyInputFocus(input, form) {
        if (!(input instanceof HTMLInputElement) || input.dataset.focusStabilized === "true") {
          return;
        }

        input.dataset.focusStabilized = "true";
        input.addEventListener("focus", () => {
          input.classList.add("is-highlighted");
          scrollJourneyOptInFormAboveKeyboard(input, form);
        });
        input.addEventListener("input", () => {
          input.classList.remove("is-highlighted");
        });
      }

              .map((char) => char + char)

        if (!match) {

        event?.preventDefault();
        event?.stopPropagation();
        window.open(GITHUB_PROFILE_URL, "_blank", "noopener,noreferrer");
      }

      function attachGithubContributionsClick() {
        const calendar =
          document.querySelector(".github-contributions-link") ||
          document.querySelector(".react-activity-calendar")?.closest("a");

        if (!calendar) {
          return;
        }

        calendar.setAttribute("href", GITHUB_PROFILE_URL);
        calendar.setAttribute("target", "_blank");
        calendar.setAttribute("rel", "noopener noreferrer");
        calendar.setAttribute("aria-label", "Open Jannis Grimm on GitHub");
        calendar.classList.add("github-contributions-link");
        calendar.style.position = "relative";
        calendar.style.zIndex = "50";
        calendar.style.pointerEvents = "auto";
        calendar.style.cursor = "pointer";

        if (calendar.parentElement) {
          calendar.parentElement.style.position = "relative";
          calendar.parentElement.style.zIndex = "50";
          calendar.parentElement.style.pointerEvents = "auto";
        }

        calendar.querySelectorAll(".react-activity-calendar, .react-activity-calendar *").forEach((node) => {
          node.style.pointerEvents = "none";
        });

        let overlay = calendar.querySelector(".portfolio-github-click-overlay");
        if (!overlay) {
          overlay = document.createElement("span");
          overlay.className = "portfolio-github-click-overlay";
          overlay.setAttribute("aria-hidden", "true");
          overlay.style.position = "absolute";
          overlay.style.inset = "0";
          overlay.style.zIndex = "60";
          overlay.style.cursor = "pointer";
          overlay.style.background = "transparent";
          calendar.appendChild(overlay);
        }

        if (!calendar.dataset.githubClickAttached) {
          calendar.addEventListener("click", openGithubProfileFromWidget, true);
          overlay.addEventListener("click", openGithubProfileFromWidget, true);
          calendar.dataset.githubClickAttached = "true";
        }
      }

      bootstrapPortfolio();
    </script>
  </body>
</html>
