name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:tars-prompt-storm
      - run: npm run build
      - run: |
          gh auth setup-git
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          npm exec gh-pages -- -d dist
          gh api --method POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}
