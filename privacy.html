<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-2VVwIM_r.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Privacy policy for iamjannisgrimm.com." />
    <title>Privacy Policy | Jannis Grimm</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "SF Pro Display",
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        --bg:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.96), transparent 28%),
          radial-gradient(circle at top right, rgba(233, 240, 255, 0.9), transparent 26%),
          linear-gradient(180deg, #f7f8fb 0%, #eef2f7 100%);
        --surface: rgba(255, 255, 255, 0.78);
        --surface-strong: rgba(255, 255, 255, 0.88);
        --text: #111318;
        --muted: #5e6776;
        --border: rgba(17, 19, 24, 0.08);
        --accent: #0071e3;
        --shadow:
          0 1px 2px rgba(15, 23, 42, 0.04),
          0 18px 42px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      main {
        width: min(920px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }

      .back-link,
      .footer-link {
        color: rgba(17, 19, 24, 0.64);
        text-decoration: none;
        font-size: 13px;
        transition: color 160ms ease;
      }

      .back-link:hover,
      .footer-link:hover {
        color: rgba(17, 19, 24, 0.9);
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 30px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: saturate(180%) blur(26px);
        -webkit-backdrop-filter: saturate(180%) blur(26px);
        padding: 34px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #6d7584;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 12px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 3.4rem);
        letter-spacing: -0.06em;
      }

      .lede {
        margin: 14px 0 0;
        max-width: 680px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .markdown-body {
        margin-top: 22px;
        display: grid;
        gap: 14px;
      }

      .markdown-card {
        border: 1px solid rgba(17, 19, 24, 0.05);
        border-radius: 22px;
        background: var(--surface-strong);
        padding: 20px 22px;
      }

      .markdown-card h2,
      .markdown-card h3 {
        margin: 0 0 8px;
        letter-spacing: -0.03em;
      }

      .markdown-card p,
      .markdown-card li {
        color: var(--muted);
        line-height: 1.65;
      }

      .markdown-card ul {
        margin: 10px 0 0;
        padding-left: 18px;
      }

      .markdown-card a {
        color: var(--accent);
        text-decoration: none;
      }

      .fine-print {
        margin-top: 18px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .footer {
        display: flex;
        justify-content: center;
        padding-top: 18px;
      }

      @media (max-width: 720px) {
        main {
          width: min(920px, calc(100vw - 20px));
          padding: 20px 0 28px;
        }

        .panel {
          padding: 24px 20px;
          border-radius: 24px;
        }

        .topbar {
          margin-bottom: 14px;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/privacy-Dmk30E35.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <main>
      <div class="topbar">
        <a class="back-link" href="./index.html">Back to portfolio</a>
      </div>

      <section class="panel">
        <p class="eyebrow">Privacy</p>
        <h1 id="policy-title">Privacy Policy</h1>
        <p class="lede">Loading current policy…</p>
        <div id="policy-content" class="markdown-body"></div>
        <p id="policy-updated" class="fine-print"></p>
      </section>

      <div class="footer">
        <a class="footer-link" href="./index.html">Jannis Grimm</a>
      </div>
    </main>

  </body>
</html>
