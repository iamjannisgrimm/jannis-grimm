<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Privacy policy for iamjannisgrimm.com." />
    <title>Privacy Policy | Jannis Grimm</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "SF Pro Display",
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        --bg:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.96), transparent 28%),
          radial-gradient(circle at top right, rgba(233, 240, 255, 0.9), transparent 26%),
          linear-gradient(180deg, #f7f8fb 0%, #eef2f7 100%);
        --surface: rgba(255, 255, 255, 0.78);
        --surface-strong: rgba(255, 255, 255, 0.88);
        --text: #111318;
        --muted: #5e6776;
        --border: rgba(17, 19, 24, 0.08);
        --accent: #0071e3;
        --shadow:
          0 1px 2px rgba(15, 23, 42, 0.04),
          0 18px 42px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      main {
        width: min(920px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }

      .back-link,
      .footer-link {
        color: rgba(17, 19, 24, 0.64);
        text-decoration: none;
        font-size: 13px;
        transition: color 160ms ease;
      }

      .back-link:hover,
      .footer-link:hover {
        color: rgba(17, 19, 24, 0.9);
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 30px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: saturate(180%) blur(26px);
        -webkit-backdrop-filter: saturate(180%) blur(26px);
        padding: 34px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #6d7584;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 12px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 3.4rem);
        letter-spacing: -0.06em;
      }

      .lede {
        margin: 14px 0 0;
        max-width: 680px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .markdown-body {
        margin-top: 22px;
        display: grid;
        gap: 14px;
      }

      .markdown-card {
        border: 1px solid rgba(17, 19, 24, 0.05);
        border-radius: 22px;
        background: var(--surface-strong);
        padding: 20px 22px;
      }

      .markdown-card h2,
      .markdown-card h3 {
        margin: 0 0 8px;
        letter-spacing: -0.03em;
      }

      .markdown-card p,
      .markdown-card li {
        color: var(--muted);
        line-height: 1.65;
      }

      .markdown-card ul {
        margin: 10px 0 0;
        padding-left: 18px;
      }

      .markdown-card a {
        color: var(--accent);
        text-decoration: none;
      }

      .fine-print {
        margin-top: 18px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .footer {
        display: flex;
        justify-content: center;
        padding-top: 18px;
      }

      @media (max-width: 720px) {
        main {
          width: min(920px, calc(100vw - 20px));
          padding: 20px 0 28px;
        }

        .panel {
          padding: 24px 20px;
          border-radius: 24px;
        }

        .topbar {
          margin-bottom: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <a class="back-link" href="./index.html">Back to portfolio</a>
      </div>

      <section class="panel">
        <p class="eyebrow">Privacy</p>
        <h1 id="policy-title">Privacy Policy</h1>
        <p class="lede">Loading current policy…</p>
        <div id="policy-content" class="markdown-body"></div>
        <p id="policy-updated" class="fine-print"></p>
      </section>

      <div class="footer">
        <a class="footer-link" href="./index.html">Jannis Grimm</a>
      </div>
    </main>

    <script type="module">
      const CONTENT_ENDPOINT =
        window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
          ? "https://dashboard.iamjannisgrimm.com/api/content?key=privacy_policy"
          : "https://dashboard.iamjannisgrimm.com/api/content?key=privacy_policy";

      const defaultPolicy = `# Privacy Policy

This website is a personal portfolio for Jannis Grimm. It uses limited visit analytics to understand traffic, maintain the site, and review overall audience activity.

## Information Collected

- IP address
- Approximate location inferred from the request, such as country, region, or city
- Pages visited
- Referrer information
- Browser and device metadata such as user agent
- Timestamps of visits

## How This Information Is Used

- measure overall portfolio traffic
- understand where visitors are coming from
- identify repeat visits and general audience patterns
- support site operations, maintenance, and security review

## Sharing

Visit data is stored using Supabase and may be processed through hosting or infrastructure providers used to operate the site. It is not sold.

## Retention

Visit data may be retained for as long as reasonably useful for analytics, operational review, and record keeping, unless a shorter retention period is required.

## Contact

If you have privacy questions about this website, you can reach out through the contact methods listed on the portfolio.`;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function parseInlineMarkdown(value) {
        return escapeHtml(value).replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      }

      function renderMarkdown(markdown) {
        const lines = markdown.split(/\r?\n/);
        const blocks = [];
        let listItems = [];
        let paragraphLines = [];

        function flushList() {
          if (!listItems.length) {
            return;
          }

          blocks.push(`<div class="markdown-card"><ul>${listItems.map((item) => `<li>${parseInlineMarkdown(item)}</li>`).join("")}</ul></div>`);
          listItems = [];
        }

        function flushParagraph() {
          if (!paragraphLines.length) {
            return;
          }

          blocks.push(`<div class="markdown-card"><p>${parseInlineMarkdown(paragraphLines.join(" "))}</p></div>`);
          paragraphLines = [];
        }

        for (const line of lines) {
          const trimmed = line.trim();

          if (!trimmed) {
            flushList();
            flushParagraph();
            continue;
          }

          if (trimmed.startsWith("## ")) {
            flushList();
            flushParagraph();
            blocks.push(`<div class="markdown-card"><h2>${parseInlineMarkdown(trimmed.slice(3))}</h2></div>`);
            continue;
          }

          if (trimmed.startsWith("### ")) {
            flushList();
            flushParagraph();
            blocks.push(`<div class="markdown-card"><h3>${parseInlineMarkdown(trimmed.slice(4))}</h3></div>`);
            continue;
          }

          if (trimmed.startsWith("- ")) {
            flushParagraph();
            listItems.push(trimmed.slice(2));
            continue;
          }

          if (trimmed.startsWith("# ")) {
            continue;
          }

          paragraphLines.push(trimmed);
        }

        flushList();
        flushParagraph();

        return blocks.join("");
      }

      async function loadPolicy() {
        const titleElement = document.getElementById("policy-title");
        const ledeElement = document.querySelector(".lede");
        const contentElement = document.getElementById("policy-content");
        const updatedElement = document.getElementById("policy-updated");

        try {
          const response = await fetch(CONTENT_ENDPOINT);
          if (!response.ok) {
            throw new Error("Failed to load policy.");
          }

          const documentPayload = await response.json();
          const body = typeof documentPayload?.body === "string" && documentPayload.body
            ? documentPayload.body
            : defaultPolicy;

          titleElement.textContent = typeof documentPayload?.title === "string" && documentPayload.title
            ? documentPayload.title
            : "Privacy Policy";
          ledeElement.textContent = "This policy reflects the current privacy settings for this website.";
          contentElement.innerHTML = renderMarkdown(body);
          updatedElement.textContent = documentPayload?.updatedAt
            ? `Last updated: ${new Date(documentPayload.updatedAt).toLocaleDateString()}`
            : "Last updated: April 8, 2026";
        } catch {
          titleElement.textContent = "Privacy Policy";
          ledeElement.textContent = "This policy reflects the current privacy settings for this website.";
          contentElement.innerHTML = renderMarkdown(defaultPolicy);
          updatedElement.textContent = "Last updated: April 8, 2026";
        }
      }

      loadPolicy();
    </script>
  </body>
</html>
